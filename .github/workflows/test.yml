name: Tests

on:
  push:
    branches: [main]
    paths:
      - '**.tsx'
      - '**.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.tsx'
      - '**.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        timezone: [UTC, America/Denver, Asia/Tokyo]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run tests (TZ=${{ matrix.timezone }})
        run: npm test
        env:
          TZ: ${{ matrix.timezone }}

  test-summary:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "✅ All timezone tests passed"
          else
            echo "❌ Some tests failed"
            exit 1
          fi
