name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - '**.tsx'
      - '**.ts'
      - '**.css'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.tsx'
      - '**.ts'
      - '**.css'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Node + dependencies ───────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Vite build ────────────────────────────────────────────────────────
      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: https://ai-pill-reminder.vercel.app

      # ── Security check: ensure no API keys leaked into client bundle ──────
      - name: Check for leaked API keys in build output
        run: |
          if grep -rE 'AIza[0-9A-Za-z_-]{35}' dist/; then
            echo "::error::API key pattern found in dist/ - build contains leaked credentials"
            exit 1
          fi
          echo "No API key patterns found in build output"

      # ── Capacitor Android ─────────────────────────────────────────────────
      - name: Setup Java (JDK 21 required for Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components for Capacitor 7
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Add Android platform (if not present)
        run: |
          if [ ! -d "android" ]; then
            npm install @capacitor/android@^7.0.0 --no-save
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: remedi-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Build summary
        run: |
          echo "✅ Android APK built successfully"
          echo "Download from GitHub Actions → Artifacts tab"
          echo "SHA: ${{ github.sha }}"
